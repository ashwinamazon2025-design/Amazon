<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>NILDA™ Instruction Video</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#070707;
      --panel:#101010;
      --line:#2b2b2b;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --accent:#d8a94a;
    }

    *{
      box-sizing:border-box;
      -webkit-user-select:none;
      user-select:none;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      padding:16px 22px;
      border-bottom:1px solid var(--line);
      background:#090909;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .brand{
      font-weight:900;
      letter-spacing:.04em;
    }

    .brand span{
      color:var(--accent);
    }

    #videoTitle{
      color:var(--muted);
      font-size:.95rem;
      font-weight:700;
      overflow-wrap:anywhere;
    }

    main{
      width:min(1200px,100%);
      margin:auto;
      padding:24px;
    }

    .player-shell{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
    }

    .video-wrap{
      background:#000;
      aspect-ratio:16/9;
      display:grid;
      place-items:center;
    }

    video{
      display:block;
      width:100%;
      height:100%;
      max-height:calc(100vh - 150px);
      background:#000;
      object-fit:contain;
      -webkit-user-drag:none;
      user-drag:none;
    }

    .message{
      padding:24px;
      color:var(--muted);
      text-align:center;
      line-height:1.5;
    }

    @media(max-width:650px){
      header{padding:12px 14px;}
      main{padding:12px;}
      .player-shell{border-radius:12px;}
      #videoTitle{font-size:.82rem;}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">NILDA™ <span>Instruction Hub</span></div>
    <div id="videoTitle">Instruction Video</div>
  </header>

  <main>
    <div class="player-shell">
      <div id="videoWrap" class="video-wrap">
        <video
          id="instructionVideo"
          controls
          autoplay
          playsinline
          preload="metadata"
          controlsList="nodownload noremoteplayback"
          disablePictureInPicture
          oncontextmenu="return false;"
        ></video>
      </div>
      <div id="message" class="message" hidden></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawSrc = String(params.get("src") || "").trim();
    const rawTitle = String(params.get("title") || "Instruction Video").trim();

    const video = document.getElementById("instructionVideo");
    const title = document.getElementById("videoTitle");
    const message = document.getElementById("message");
    const videoWrap = document.getElementById("videoWrap");

    title.textContent = rawTitle || "Instruction Video";
    document.title = `${rawTitle || "Instruction Video"} - NILDA™`;

    function isSafeRelativeVideoPath(value){
      if(!value) return false;
      if(/^[a-z][a-z0-9+.-]*:/i.test(value)) return false;
      if(value.startsWith("//")) return false;
      if(value.includes("\\")) return false;
      if(value.split("/").includes("..")) return false;
      return /\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(value);
    }

    if(isSafeRelativeVideoPath(rawSrc)){
      video.src = rawSrc.replace(/^\/+/, "");
    }else{
      video.remove();
      videoWrap.style.display = "none";
      message.hidden = false;
      message.textContent = "This video link is unavailable.";
    }

    document.addEventListener("contextmenu", event => {
      event.preventDefault();
    }, true);

    document.addEventListener("dragstart", event => {
      event.preventDefault();
    }, true);

    document.addEventListener("keydown", event => {
      const key = String(event.key || "").toLowerCase();
      const modifier = event.ctrlKey || event.metaKey;
      const blocked =
        event.key === "F12" ||
        (modifier && key === "u") ||
        (modifier && event.shiftKey && ["i","j","c"].includes(key));

      if(blocked){
        event.preventDefault();
        event.stopPropagation();
      }
    }, true);

    video?.addEventListener("contextmenu", event => {
      event.preventDefault();
    });
  </script>
</body>
</html>
