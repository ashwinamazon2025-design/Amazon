<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructional Videos</title>

  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1000px, calc(100% - 32px));
      margin: 40px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-button {
      border: 0;
      border-bottom: 3px solid var(--accent);
      background: transparent;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      cursor: default;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.05);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 1.2rem;
    }

    .card p {
      color: var(--muted);
      margin-top: 0;
    }

    video {
      width: 100%;
      max-height: 560px;
      border-radius: 8px;
      background: #000;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 24px;
      }

      .header h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Instructions & Training</h1>
      <p>Watch the instructional videos below.</p>
    </header>

    <div class="tabs">
      <button class="tab-button" type="button">
        Instructional Videos
      </button>
    </div>

    <section aria-label="Instructional Videos">

      <div class="card">
        <h2>Build Your Chassis — Step by Step</h2>
        <p>Soft Piano</p>

        <video controls preload="metadata">
          <source
            src="./code/Build_Your_Chassis_Step_by_Step_Soft_Piano-Final.mp4"
            type="video/mp4"
          />
          Your browser does not support the HTML5 video element.
        </video>
      </div>

      <div class="card">
        <h2>Caster Wheel Chassis — Step by Step</h2>
        <p>Soft Guitar</p>

        <video controls preload="metadata">
          <source
            src="./code/Caster_Wheel_Chassis_Step_by_Step_Soft_Guitar-Final.mp4"
            type="video/mp4"
          />
          Your browser does not support the HTML5 video element.
        </video>
      </div>

      <div class="card">
        <h2>Mandala Coaster — Child Painting</h2>
        <p>Carnatic Music</p>

        <video controls preload="metadata">
          <source
            src="./code/Mandala_Coaster_Child_Painting_Video_Carnatic.mp4"
            type="video/mp4"
          />
          Your browser does not support the HTML5 video element.
        </video>
      </div>

    </section>
  </main>
</body>
</html>
